openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Authenticated account access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me/attendee-access:
    post:
      operationId: ensureAttendeeAccess
      tags: [account]
      summary: Ensure a signed-in user has attendee access
      description: Assigns the attendee role to an unassigned authenticated user. It never changes an instructor role.
      responses:
        "200":
          description: The signed-in account's current role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRoleResponse"
        "401":
          description: Authentication is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AccountRoleResponse:
      type: object
      properties:
        role:
          type: string
          enum: [attendee, instructor, unassigned]
        canAccessAttendeePortal:
          type: boolean
        canAccessInstructorPortal:
          type: boolean
      required:
        - role
        - canAccessAttendeePortal
        - canAccessInstructorPortal
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

